name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: unzip -q -o admin.zip
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug -PverCode=${{ github.run_number }} -PanalyticsUrl=${{ vars.ANALYTICS_URL }}
        working-directory: admin
      - name: Tạo Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp admin/admin/build/outputs/apk/debug/admin-debug.apk td-admin.apk
          gh release delete "v${{ github.run_number }}" --yes --cleanup-tag || true
          gh release create "v${{ github.run_number }}" td-admin.apk \
            --title "tđ.exe v${{ github.run_number }}" \
            --notes "Bản build số ${{ github.run_number }}" \
            --latest
